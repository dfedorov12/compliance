name: Syntax-Check

on:
  push:
  pull_request:

# Nur lesen: Der Lauf braucht keine Schreibrechte am Repository.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0 – auf den Commit festgelegt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4.4.0
        with:
          node-version: "20"
      - name: JavaScript pruefen
        run: for f in js/*.js; do node --check "$f"; done
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: "3.12"
      - name: Python pruefen
        run: python -m py_compile cron/compliance_cron.py
