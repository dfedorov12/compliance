name: Syntax-Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: JavaScript pruefen
        run: for f in js/*.js; do node --check "$f"; done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python pruefen
        run: python -m py_compile cron/compliance_cron.py
