name: Cache-Busting

# Ersetzt nach jedem Push die ?v=... Parameter in index.html durch die Commit-SHA,
# damit Browser nach einer Aenderung nicht die alten JS-/CSS-Dateien laden.

on:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  bust:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0 – auf den Commit festgelegt
      - name: Versionsparameter setzen
        run: |
          SHA="${GITHUB_SHA::8}"
          sed -i -E "s/\?v=[A-Za-z0-9._-]+/?v=$SHA/g" index.html
          if git diff --quiet; then
            echo "Keine Aenderung noetig."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "Cache-Busting auf $SHA [skip ci]"
          git push
